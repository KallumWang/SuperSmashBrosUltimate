name = "smash-relay"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# RelayRoom = one per room code (WebSocket relay).
# Leaderboard = one global instance (accounts + wins/games).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# v2 adds the Leaderboard object (SQLite-backed).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]
